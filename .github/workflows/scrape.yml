# CI + scheduled scrape.
#   push / PR          -> test job (all tests, incl. DB tests and the offline browser test)
#   schedule (weekly)  -> test, then a full live scrape -> Excel/CSV uploaded as an artifact
#   manual dispatch    -> same, with an optional --limit (default 50 for a quick run)
#
# Why a Postgres service container (not a --no-db mode): CI runs the exact same code path
# as WSL (schema, single-transaction store, change detection, removal rule) and the DB tests
# run for real instead of being skipped. The database is fresh on every run, so in CI the
# Changes sheet lists everything as "new". Real run-to-run history lives in the WSL database,
# fed by the cron/systemd schedule in deploy/.
name: scrape

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      limit:
        description: "Books to scrape (empty = full catalogue, ~18 min)"
        required: false
        default: "50"

permissions:
  contents: read

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_DB: scraper
  POSTGRES_USER: scraper
  OUTPUT_DIR: outputs
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scraper
          POSTGRES_USER: scraper
          # Only reachable from this runner; no password is stored anywhere.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scraper -d scraper"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Throwaway DB password (the app requires one; trust auth ignores it)
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Tests (DB and browser tests must run; a missing dependency fails, never skips)
        env:
          REQUIRE_DB: "1"
          REQUIRE_BROWSER: "1"
        # -rsxX lists every skipped/xfailed/xpassed test in the log; there should be none.
        run: python -m pytest -o addopts="" -v -rsxX

  scrape:
    needs: test
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scraper
          POSTGRES_USER: scraper
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scraper -d scraper"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SCRAPER_DELAY_SECONDS: "1.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Throwaway DB password
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Scrape books.toscrape.com (live) and export
        env:
          LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.limit || '' }}
        run: |
          if [ -z "$LIMIT" ]; then
            python -m scraper run-all
          elif [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            python -m scraper run-all --limit "$LIMIT"
          else
            echo "limit must be a positive integer" >&2; exit 1
          fi
      - name: Change-tracking demo (SIMULATION, separate report)
        run: python -m scraper run-all --simulate-changes
      - name: Scrape quotes.toscrape.com/js/ (Playwright)
        run: python -m scraper quotes
      - name: Upload Excel, CSV and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-report-${{ github.run_number }}
          path: |
            outputs/reports/*.xlsx
            outputs/csv/**
            outputs/logs/**
          if-no-files-found: warn
          retention-days: 30
